name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw -B verify

  docker:
    name: Docker image + PostgreSQL smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - name: Wait for the API
        run: timeout 120 bash -c 'until curl -sf localhost:8080/actuator/health; do sleep 2; done'
      - name: Create a group and settle up against PostgreSQL
        run: |
          curl -sf -X POST localhost:8080/api/groups -H 'Content-Type: application/json' \
            -d '{"name":"CI","members":["A","B"]}'
          curl -sf -X POST localhost:8080/api/groups/1/expenses -H 'Content-Type: application/json' \
            -d '{"description":"Test","amount":10.00,"paidBy":1}'
          curl -sf localhost:8080/api/groups/1/settlements | tee out.json
          grep -q '"amount":5.00' out.json
      - if: always()
        run: docker compose logs api
