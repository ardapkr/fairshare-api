spring.application.name=fairshare-api

# Default: in-memory H2 database, so the app runs with no setup. Data is lost on restart.
spring.datasource.url=jdbc:h2:mem:fairshare;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Only expose the health endpoint (used by the Docker health check)
management.endpoints.web.exposure.include=health

# OpenAPI docs: /swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
